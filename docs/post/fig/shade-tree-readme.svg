<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ShadeNet reputation gate and network path</title>
  <desc id="desc">An admitted member proves a hidden rate-commitment leaf to a Shade Tree node. An agent reaches that node through a local Proxy and Tor, while the Elder Tree only serves the signed canopy directory.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07100c"/>
      <stop offset="1" stop-color="#101d16"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{fill:#dde5d5;font:600 25px ui-sans-serif,system-ui,sans-serif}
      .small{fill:#93a486;font:500 19px ui-monospace,SFMono-Regular,Menlo,monospace}
      .title{fill:#d1b66e;font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
      .mid{text-anchor:middle}
      .line{fill:none;stroke:#65765d;stroke-width:3}
      .signal{fill:none;stroke:#d1b66e;stroke-width:5;stroke-linecap:butt;stroke-dasharray:9 11}
      .discovery{fill:none;stroke:#65765d;stroke-width:2;stroke-dasharray:6 8}
      .card{fill:#0b1610;stroke:#344438;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="700" rx="18" fill="url(#ground)"/>
  <path d="M42 350H1158" stroke="#344438" stroke-width="2"/>

  <!-- Row 1: three cards on one baseline, connectors with the same clearance at both ends. -->
  <text class="title" x="54" y="56">01 · reputation gate</text>
  <g transform="translate(54 92)">
    <rect class="card" width="238" height="190" rx="10"/>
    <circle cx="55" cy="70" r="23" fill="#65765d"/><circle cx="102" cy="58" r="28" fill="#788564"/><circle cx="153" cy="76" r="22" fill="#506244"/>
    <path class="line" d="M55 102v32m47-44v44m51-30v30"/>
    <text class="label" x="28" y="162">Admitted set</text>
  </g>
  <path class="signal" d="M312 187H422"/>
  <g transform="translate(442 92)">
    <rect class="card" width="285" height="190" rx="10"/>
    <path d="M55 54h78v78H55z" fill="none" stroke="#93a486" stroke-width="3"/>
    <path d="M75 74h38v38H75z" fill="#d1b66e" opacity=".8"/>
    <path d="M156 60h92M156 94h72M156 128h86" class="line"/>
    <text class="label" x="28" y="162">Hidden leaf + proof</text>
  </g>
  <path class="signal" d="M747 187H856"/>
  <g transform="translate(876 92)">
    <rect class="card" width="270" height="190" rx="10"/>
    <g transform="translate(12.2 20.6) scale(.88)">
      <path d="M135 38v83" stroke="#6a5940" stroke-width="16"/>
      <circle cx="105" cy="53" r="35" fill="#506244"/><circle cx="146" cy="39" r="42" fill="#788564"/><circle cx="177" cy="67" r="32" fill="#40543a"/>
    </g>
    <text class="label" x="28" y="162">Node verifies</text>
  </g>
  <text class="small mid" x="600" y="320">Groth16 RLN · target-bound signal · epoch nullifier budget</text>

  <!-- Row 2: every element is centred on y=496, the line the traffic path runs along. -->
  <text class="title" x="54" y="398">02 · network path</text>
  <g transform="translate(54 428)">
    <rect class="card" width="205" height="136" rx="10"/>
    <g transform="translate(5 0)">
      <rect x="37" y="34" width="54" height="42" rx="4" fill="none" stroke="#93a486" stroke-width="3"/>
      <path class="line" d="M48 91h32m-16-15v15"/>
      <text class="label" x="106" y="65">Agent</text>
      <text class="small" x="38" y="113">Proxy local</text>
    </g>
  </g>
  <path class="signal" d="M279 496H349"/>
  <g transform="translate(369 428)">
    <rect class="card" width="184" height="136" rx="10"/>
    <g transform="translate(-2.5 -2)">
      <path d="M35 77c0-18 14-32 32-32 8-21 40-24 53-6 21-2 34 14 34 31 0 21-17 32-38 32H63c-17 0-28-10-28-25z" fill="#344634" stroke="#65765d" stroke-width="2"/>
      <text class="label mid" x="94.5" y="82">Tor</text>
    </g>
  </g>
  <path class="signal" d="M573 496H643"/>
  <g transform="translate(663 428)">
    <rect class="card" width="272" height="136" rx="10"/>
    <g transform="translate(51.2 16.4) scale(.8)">
      <path d="M102 30v61" stroke="#6a5940" stroke-width="14"/>
      <circle cx="78" cy="41" r="27" fill="#506244"/><circle cx="109" cy="31" r="34" fill="#788564"/><circle cx="136" cy="50" r="25" fill="#40543a"/>
    </g>
    <text class="label mid" x="136" y="118">Shade Tree node</text>
  </g>
  <path class="signal" d="M955 496H1025"/>
  <g transform="translate(1045 458)">
    <rect width="76" height="76" rx="8" fill="#d1b66e" opacity=".9" filter="url(#glow)"/>
    <rect x="20" y="20" width="36" height="36" fill="#07100c"/>
  </g>
  <text class="small mid" x="1083" y="566">destination</text>

  <!-- Discovery: the Elder Tree hangs off a thin line that joins the Proxy and the node, clear of its caption. -->
  <path class="discovery" d="M156.5 574V594Q156.5 602 164.5 602H791Q799 602 799 594V574"/>
  <g transform="translate(461 602)">
    <path d="M0 18v28" stroke="#d1b66e" stroke-width="3"/>
    <circle r="20" fill="#788564"/>
    <text class="small" x="34" y="34">Elder Tree serves the signed directory</text>
    <text class="small" x="34" y="62">discovery only · no agent traffic</text>
  </g>
</svg>
