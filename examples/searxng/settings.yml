# Rendered by the searxng-settings service: __SHADENET_TOKEN__ and __SECRET_KEY__ are filled in
# at start-up (SearXNG's settings.yml cannot read environment variables).
use_default_settings: true

server:
  secret_key: "__SECRET_KEY__"
  limiter: false # a private instance for your own agents
  image_proxy: false

search:
  formats: [html, json] # json is what `shadenet mcp --searxng-url` uses

outgoing:
  request_timeout: 8.0 # a cold tunnel is canopy + proof + onion rendezvous
  max_request_timeout: 30.0
  networks:
    shadenet:
      proxies:
        all://:
          - http://shadenet:__SHADENET_TOKEN__@127.0.0.1:8118
      enable_http: false # nodes egress to 443 only; never spend a tunnel on http://
      retries: 0 # a retry is another tunnel
      keepalive_expiry: 55.0 # reuse an open tunnel within the 60 s epoch
      max_keepalive_connections: 4

# Only engines that block Tor or datacenter IPs go through ShadeNet. Every engine routed here costs
# one tunnel per query (less with keep-alive), so keep the list short and match it to your tier.
engines:
  - name: google
    network: shadenet
  - name: bing
    network: shadenet
  - name: duckduckgo
    network: shadenet
