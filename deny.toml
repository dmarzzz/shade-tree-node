# cargo-deny policy for the Rust workspace (HYG-10). CI runs `cargo deny check` and
# `cargo audit` in the supply-chain job; both must pass.
#
# Every advisory ignore names the path it arrives by and why the reachable surface is
# safe. Revisit each one when the upstream it comes through moves.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Unmaintained transitive crates (paste, fxhash, bincode, derivative, proc-macro-error,
# atomic-polyfill) arrive via arkworks, wasmer and arti; only fail on our direct deps.
unmaintained = "workspace"
ignore = [
  # rkyv 0.7 via ark-circom -> wasmer-wasix -> virtual-net. wasmer only loads the repo's own
  # embedded rln.wasm / withdraw.wasm (hash-pinned in testdata/zk-artifacts.lock.json);
  # no untrusted archive is ever deserialized. Clears when ark-circom moves off wasmer 5.
  { id = "RUSTSEC-2026-0235", reason = "wasmer only loads hash-pinned embedded circuits" },
  # rsa (Marvin) via arti -> tor-key-forge -> ssh-key. The client never decrypts or signs
  # with RSA; Tor uses RSA identities for verification only. No patched version exists.
  { id = "RUSTSEC-2023-0071", reason = "verification-only RSA use inside arti; no fix upstream" },
  # tracing-subscriber 0.2 via ark-relations (constraint tracing). We never install that
  # subscriber or log user input through it. Clears with the arkworks 0.6 upgrade.
  { id = "RUSTSEC-2025-0055", reason = "subscriber not installed; clears with arkworks 0.6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
