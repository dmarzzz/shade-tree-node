[package]
name = "shadenet-node"
version = "0.8.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "ShadeNet node: the `shadenet-node` binary, a proof-gated Tor egress node (ADR 0014)"
repository = "https://github.com/dmarzzz/shade-tree-node"
publish = false

[lib]
name = "shadenet_node"
path = "src/lib.rs"

[[bin]]
name = "shadenet-node"
path = "src/main.rs"

[dependencies]
shadenet-proto = { path = "../shadenet-proto", version = "0.8.0" }
shadenet-service = { path = "../shadenet-service", version = "0.8.0" }
shadenet = { path = "../shadenet", version = "0.8.0", default-features = false }
# Verification only: no witness calculator, no wasmer.
shadenet-rln = { path = "../shadenet-rln", version = "0.8.0", default-features = false }
ark-bn254 = "0.5"
ark-ff = "0.5"
num-bigint = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal", "fs", "process"] }
# nonces and boot ids come from operating-system randomness
getrandom = "0.4"
# keccak-256 for the EIP-1186 proof verifier (already in the tree through shadenet-proto)
sha3 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# SIGTERM to the tor child, free disk space for `check`
libc = "0.2"

[dev-dependencies]
# Real proofs for the end-to-end tests, made with the embedded testnet artifacts.
shadenet-rln = { path = "../shadenet-rln", version = "0.8.0", features = ["prove", "embedded-artifacts"] }
