[package]
name = "shadenet"
version = "0.6.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "ShadeNet Rust SDK: proof-gated anonymous egress over zkReputationTor (RLN membership proofs + Tor onion services)"
repository = "https://github.com/dmarzzz/shade-tree-node"
publish = false

[features]
# `live` is the SDK: embedded Arti, the RLN prover with its embedded artifacts, on-chain member
# discovery, the long-lived Client and the local proxy. Without it the crate is the deterministic
# half only (bundled network profiles, canopy verification, selection filters, health cache), which
# is what the fast default `shadenet-cli` build links.
default = ["live"]
live = [
    "dep:shadenet-rln",
    "shadenet-rln/embedded-artifacts",
    "dep:arti-client",
    "dep:tor-rtcompat",
    "dep:tokio",
    "dep:futures",
    "dep:reqwest",
    "dep:base64",
    "dep:getrandom",
    "dep:url",
    "dep:http",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
# Session tickets (#103) are designed but OFF: the flag exists so economics (H2) can choose them
# without an SDK release. Enabling it today only exposes the config knob; the wire is unchanged.
session-tickets = []

[dependencies]
shadenet-proto = { path = "../shadenet-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
# shadenet::eth (replaces ethers-core): both already in the tree through shadenet-proto.
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.12"
num-bigint = "0.4"

shadenet-rln = { path = "../shadenet-rln", optional = true }
# Embedded Tor. `compression` stays off (one onion, one JSON line) and `static-sqlite` bundles
# SQLite so the binary never links the host's libsqlite3.
arti-client = { version = "0.46", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite", "hs-pow-full"], optional = true }
tor-rtcompat = { version = "0.46", default-features = false, features = ["tokio", "rustls"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
base64 = { version = "0.23", optional = true }
getrandom = { version = "0.4", optional = true }
# `Client::fetch`: HTTPS over a tunnel (HTTP/1.1, rustls with the ring provider already in the tree).
url = { version = "2", optional = true }
http = { version = "1", optional = true }
hyper = { version = "1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "test-util"] }
