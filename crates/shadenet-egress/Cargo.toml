[package]
name = "shadenet-egress"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Reusable proof-gated Shade Tree egress transport"
publish = false

[dependencies]
arti-client = { version = "0.46", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite"] }
shadenet-proto = { path = "../shadenet-proto" }
shadenet-rln = { path = "../shadenet-rln", features = ["embedded-artifacts"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tor-rtcompat = { version = "0.46", default-features = false, features = ["tokio", "rustls"] }
