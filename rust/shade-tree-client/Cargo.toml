[package]
name = "shade-tree-client"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Shade Tree distributable client: single static binary with embedded Tor. Rust port of client/shade-tree-client.mjs."
publish = false

[[bin]]
name = "shade-tree"
path = "src/main.rs"

[features]
# `live` pulls the RLN prover (shade-tree-rln -> ark-circom/wasmer) so `shade-tree egress` can mint a
# REAL envelope (T-RUST-2d) AND the embedded-Tor transport (arti-client + tokio, T-RUST-2e)
# so `shade-tree egress` dials the selected gateway `.onion` over Tor with no system tor daemon
# and no SOCKS. It is OFF by default: the everyday `cargo build` (default-members) never
# compiles the heavy native tree or arti, keeping the deterministic client sub-second. Build
# the live path with `cargo build -p shade-tree-client --features live`.
# `shade-tree-rln/embedded-artifacts` (T-RUST-4): the RLN circuit artifacts are `include_bytes!`'d
# into the `live` binary, so a released `shade-tree` egresses with NO external circuit files
# (`--circuits` becomes optional; omit it to use the embedded artifacts). The ~8MB of
# artifacts land only in the `live` build — the default deterministic binary never pulls
# shade-tree-rln at all, so it stays small.
live = ["dep:shade-tree-rln", "shade-tree-rln/embedded-artifacts", "dep:shade-tree-egress", "dep:tokio", "dep:reqwest", "dep:num-bigint", "dep:getrandom", "dep:ethers-core"]

[dependencies]
shade-tree-proto = { path = "../shade-tree-proto" }
# OPTIONAL, feature-gated (`live`): the RLN Groth16 prover + native depth-20 Poseidon tree
# (T-RUST-2b/2c). Excluded from default-members and only compiled under `--features live`,
# so the default build stays fast (no ark-circom / wasmer).
shade-tree-rln = { path = "../shade-tree-rln", optional = true }
shade-tree-egress = { path = "../shade-tree-egress", optional = true }
# T-RUST-2 deterministic client: parse UNTRUSTED directory/announce/receipt JSON into
# local DTOs, then hand the mapped shade-tree-proto structs to the trust-critical checks.
# serde/serde_json live ONLY here — shade-tree-proto's canonical byte path stays serde-free.
serde = { version = "1", features = ["derive"] } # derive Deserialize on the untrusted-JSON DTOs
serde_json = "1"                                 # parse the directory/receipt files
# hex: render pubkeys recovered from a verified receipt for display.
hex = "0.4"
base64 = "0.22"

# OPTIONAL, feature-gated (`live`): embedded Tor transport for the onion egress dial
# (T-RUST-2e). CRITICAL dep note: `default-features = false` with an explicit feature list
# turns OFF arti's `compression` feature, which links native zstd (`async-compression`) and
# was the loop-19 feasibility worry of a `links` collision with rln's sled. That collision
# does not actually arise here (the prover uses `ark-circom`, not zerokit/sled — verified
# with `cargo tree`), but compression stays OFF regardless: the client dials a single onion
# and frames one JSON line, so directory compression buys nothing. `onion-service-client`
# is what lets arti CONNECT to a `.onion` (v3 HS client). tokio drives arti's async runtime.
# `static-sqlite` (release-fix, v0.1.1): arti's directory cache (tor-dirmgr) uses rusqlite;
# without it rusqlite links the SYSTEM libsqlite3 (`-lsqlite3` / `sqlite3.lib`), which does
# not exist on the windows-latest runner (LNK1181: cannot open input file 'sqlite3.lib') and
# makes the linux/macos `live` binaries dynamically depend on the host's libsqlite3. The
# feature turns on `rusqlite/bundled` (the SQLite amalgamation compiled in via `cc`), so
# the `live` binary is self-contained on every runner OS — the whole point of the client.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync"], optional = true }
# Native on-chain membership discovery (`shade-tree leaves` and egress
# `--contract`) uses direct JSON-RPC over HTTP(S); no Node.js exporter required.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
num-bigint = { version = "0.4", optional = true }
getrandom = { version = "0.3", optional = true }
# Native member registration signs EIP-1559 transactions locally. This crate is
# live-only and already sits in the RLN prover's dependency graph, so the fast
# deterministic build remains unchanged.
ethers-core = { version = "2.0.14", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# arg parsing is hand-rolled (no clap) to keep the dep tree tiny; a small seeded PRNG
# (mulberry32, in-crate) drives `select` so no `rand` runtime dep is needed either.

# DONE under `live`: arti-client / tor-rtcompat + tokio (embedded Tor onion dial, T-RUST-2e)
# and shade-tree-rln (RLN Groth16 prover + native tree, T-RUST-2b/2c/2d).
# STILL DEFERRED (future parity work, not needed to close Gate 2):
#   alloy  -- on-chain reads (GatewayRegistry.isStaked, operator sig) for zero-trust reselect
#   hyper  -- bootnode HTTP (/directory, /announce) discovery over the same arti client
