[package]
name = "shade-tree-proto"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Trust-critical Shade Tree wire-format checks (onion<->ed25519 binding, canonical byte encodings, ed25519 verify, request-signal). Rust port of the JS reference (lib/directory.mjs, bootnode/announce.mjs, lib/rln.mjs)."
publish = false

[dependencies]
# T-RUST-1 crypto/encoding deps (wire-format conformance surface):
ed25519-dalek = "3"   # RFC 8032 ed25519 sign/verify (null-digest, raw 32-byte seed/pubkey)
sha3 = "0.12"         # SHA3-256 onion checksum + Keccak256 signal hash (calculate_signal_hash)
data-encoding = "2"   # base32 no-pad lowercase (alphabet abcdefghijklmnopqrstuvwxyz234567)
hex = "0.4"           # lowercase hex for pubkey/signature (de)serialization
num-bigint = "0.4"    # big-endian keccak digest -> BigUint >> 8 -> decimal (calculate_signal_hash)
# T-HARD-8 artifact ids: `<circuit>-<sha256(verification_key.json)[0:16]>` (artifact_id_of), the
# SAME hash testdata/zk-artifacts.lock.json pins. sha2 is already in the tree via ed25519-dalek,
# so this adds no new transitive dependency.
sha2 = "0.11"
# EIP-191 `personal_sign` recovery for gateway operator authorization.  The
# implementation hashes the prefixed message with the existing `sha3` Keccak256
# and uses k256 only for recoverable secp256k1 verification.
k256 = { version = "0.14", features = ["ecdsa"] }
# NOTE: canonical_*_bytes are hand-built in fixed key order (see the encoders below),
# NEVER via a serializer — serde is intentionally NOT a dependency of the canonical path.

[dev-dependencies]
# T-RUST-1 conformance runner reads testdata/vectors.json and asserts byte-equality.
serde_json = "1"
