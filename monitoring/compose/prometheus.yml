# Scrapes this host's loopback metrics listeners (host network; Host header stays 127.0.0.1).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: shade-tree-gateway
    static_configs:
      - targets: ["127.0.0.1:9101"]
        labels: { instance: local-node, role: node }
  - job_name: shade-tree-heartbeat
    static_configs:
      - targets: ["127.0.0.1:9102"]
        labels: { instance: local-node, role: heartbeat }
  - job_name: shade-tree-bootnode
    static_configs:
      - targets: ["127.0.0.1:9103"]
        labels: { instance: local-elder, role: elder }
