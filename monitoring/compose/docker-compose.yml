# One-node observability for a Shade Tree operator (docs/OPERATOR.md "Alerts and dashboards").
#
#   cd monitoring/compose && docker compose --profile monitoring up -d
#
# Prometheus scrapes the loopback metrics listeners of this host (gateway 9101, heartbeat 9102,
# Elder 9103 by default; docs/CONFIG.md SHADE_TREE_*METRICS_PORT), loads ../alerts.yml, and
# Grafana comes up with ../grafana-dashboard.json provisioned. Both run on the HOST network
# (Linux) and bind 127.0.0.1 only: the node's metrics listeners refuse any non-loopback Host
# header, so a bridged container could not scrape them. Put a reverse proxy with auth in front
# if you want them off-box. No Alertmanager is needed for pushed alerts: set
# SHADE_TREE_ALERT_WEBHOOK on the node instead (or add Alertmanager yourself).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts.yml:/etc/prometheus/rules/shade-tree.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana-dashboard.json:/var/lib/grafana/dashboards/shade-tree.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped
volumes:
  prometheus-data: {}
  grafana-data: {}
