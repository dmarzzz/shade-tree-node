# Prometheus alerting rules for Shade Tree (T-MON-3).
#
# Every expr references a metric that actually exists:
#   - shade_tree_bootnode_announces_total{result,reason}   (counter, bootnode/server.mjs)
#   - shade_tree_bootnode_directory_fetches_total           (counter, bootnode/server.mjs)
#   - shade_tree_bootnode_live_gateways                     (gauge,   bootnode/server.mjs)
#   - shade_tree_gateway_tunnels_total{result,reason}      (counter, gateway/gateway.mjs)
#   - shade_tree_gateway_slashes_total                      (counter, gateway/gateway.mjs)
#   - shade_tree_gateway_active_tunnels                     (gauge,   gateway/gateway.mjs)
#   - shade_tree_gateway_root_source_degraded               (gauge,   gateway/gateway.mjs)
#   - shade_tree_gateway_verify_seconds_bucket/_sum/_count  (histogram, gateway/gateway.mjs)
#   - shade_tree_heartbeat_last_success_timestamp_seconds   (gauge,   bootnode/heartbeat.mjs)
#   - up                                              (synthetic, from the scrape itself)
#
# Thresholds are grounded in docs/SLO.md. Numbers flagged [NEEDS DATA] in the SLO doc
# stay conservative here and MUST be recalibrated against the first 30 days of real data.
# Operational meaning of each alert is cross-referenced to docs/SLO.md and docs/INCIDENT.md.
#
# IMPORTANT: adjust the job matchers below to the job names you use in prometheus.yml.
# This file assumes jobs named shade-tree-bootnode, shade-tree-gateway, and
# shade-tree-heartbeat (see monitoring/README.md).

groups:
  - name: shade-tree-bootnode
    rules:
      # up==0 means the scrape itself failed: the Elder's separate loopback /metrics endpoint
      # did not answer. Clients are cushioned by the
      # last-known-good cached directory, so this is rarely member-visible, but it burns
      # the bootnode-availability budget. See SLO.md 2.2 + INCIDENT.md #1.
      - alert: BootnodeDown
        expr: up{job="shade-tree-bootnode"} == 0
        for: 2m
        labels:
          severity: critical
          component: bootnode
        annotations:
          summary: "Bootnode {{ $labels.instance }} is down / unscrapable"
          description: >-
            Prometheus cannot scrape the bootnode /metrics endpoint on {{ $labels.instance }}
            (up==0 for >2m). Discovery is degraded; clients fall back to the LKG directory
            cache. Restore or restart the bootnode. Runbook: docs/INCIDENT.md #1. If it is
            reachable but /directory verifies false, escalate to INCIDENT.md #2 (signer
            compromise). SLO: docs/SLO.md 2.2.

      # The whole failover story needs >=2 gateways to route between; below 2 there is no
      # anonymity spread (1/1, not 1/N) and nowhere to fail over to. SLO.md 2.3.
      - alert: FleetTooSmall
        expr: max(shade_tree_bootnode_live_gateways{job="shade-tree-bootnode"}) < 2
        for: 10m
        labels:
          severity: critical
          component: fleet
        annotations:
          summary: "Fleet has fewer than 2 live gateways"
          description: >-
            shade_tree_bootnode_live_gateways = {{ $value }} for >10m (SLO wants >=2). Below 2 there
            is no failover spread and target metadata is 1/1, not 1/N. Add or restore gateways
            before egress-success starts burning. Runbook: docs/INCIDENT.md #3, docs/SLO.md 2.3.

      # Zero live gateways: nothing is dialable at all. Correctness (never admit an
      # unverified gateway) is NOT relaxed to clear this; add real gateways.
      - alert: FleetEmpty
        expr: max(shade_tree_bootnode_live_gateways{job="shade-tree-bootnode"}) < 1
        for: 5m
        labels:
          severity: critical
          component: fleet
        annotations:
          summary: "No live gateways in the directory"
          description: >-
            shade_tree_bootnode_live_gateways = {{ $value }} for >5m. The directory is empty; no
            member can egress. Restore gateways. Do NOT clear this by weakening admission
            (docs/SLO.md section 5 hard line). Runbook: docs/INCIDENT.md #3.

      # Rejected announces are the gate working (a forged/rate-limited/registry-full announce
      # SHOULD be rejected). A sustained high reject FRACTION with real announce volume means
      # someone is hammering the bootnode. Guarded by a minimum accepted+rejected rate so an
      # idle bootnode does not fire. Reasons: bad sig, rate-limited, registry-full (announce.mjs
      # + registry). SLO.md section 1 (announce accept/reject = correctness counter, on the
      # dashboard, alertable as an abuse signal).
      - alert: AnnounceRejectionSpike
        expr: >-
          (
            sum by (instance) (rate(shade_tree_bootnode_announces_total{job="shade-tree-bootnode", result="rejected"}[15m]))
            /
            clamp_min(sum by (instance) (rate(shade_tree_bootnode_announces_total{job="shade-tree-bootnode"}[15m])), 1e-9)
          ) > 0.8
          and
          sum by (instance) (rate(shade_tree_bootnode_announces_total{job="shade-tree-bootnode"}[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: bootnode
        annotations:
          summary: "Announce rejection fraction > 80% on {{ $labels.instance }}"
          description: >-
            Over 15m, >80% of announces to {{ $labels.instance }} were rejected while announce
            volume is non-trivial. Rejections are the gate working, but a sustained spike means
            forged announces, a misconfigured legitimate gateway, or a full registry. Inspect the
            reason breakdown on the Shade Tree dashboard (announce panel). This is not an availability
            outage. Context: docs/SLO.md section 1.

  - name: shade-tree-gateway
    rules:
      # up==0 for a gateway scrape: its loopback /metrics server (SHADE_TREE_METRICS_PORT) did not
      # answer. A single gateway being down is explicitly NOT an SLO (SLO.md section 4); the
      # fleet routes around it. So this is a warning, and FleetTooSmall is the real page.
      - alert: GatewayDown
        expr: up{job="shade-tree-gateway"} == 0
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway {{ $labels.instance }} is down / unscrapable"
          description: >-
            Prometheus cannot scrape gateway /metrics on {{ $labels.instance }} (up==0 for >5m).
            Individual gateway uptime is NOT an SLO (docs/SLO.md section 4): client failover +
            down-marking route around it, and the TTL drops it from the directory. Escalates only
            if it pushes the fleet under 2 healthy (see FleetTooSmall). Runbook: docs/INCIDENT.md #3.

      - alert: RootSourceDegraded
        expr: max by (instance, source) (shade_tree_gateway_root_source_degraded{job="shade-tree-gateway"}) > 0
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Admission root source {{ $labels.source }} is degraded on {{ $labels.instance }}"
          description: >-
            The node could not refresh its {{ $labels.source }} admission roots and is using
            last-known-good state or another admitted source. Check the execution provider,
            Helios when configured, contract settings, and log-range start blocks. Do not remove
            proof verification to restore traffic.

      # A slash is the RLN rate limit WORKING (over-spend caught), NEVER an error budget line
      # (SLO.md section 3 + 4). But a sudden rate spike is worth a human look: a broken client
      # double-spending, or an attacker probing the nullifier logic. Warning only.
      - alert: RpcEndpointFailing
        expr: sum by (instance, endpoint) (increase(shade_tree_rpc_failovers_total[15m])) > 3
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "RPC endpoint {{ $labels.endpoint }} keeps failing on {{ $labels.instance }}"
          description: >-
            Requests are moving past endpoint index {{ $labels.endpoint }} of SHADE_TREE_RPC_URL.
            Roots stay fresh while another endpoint answers; replace or remove the failing one.
      - alert: CanopyPinDrift
        expr: count(count by (commit) (shade_tree_build_info{job=~"shade-tree-(bootnode|gateway|heartbeat)"})) > 1
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Canopy roles run more than one commit"
          description: >-
            shade_tree_build_info reports different commit labels across the Elder, nodes and
            heartbeats. Deploy every role from the one tag in the deployment record.
      - alert: SlashSpike
        expr: sum by (instance) (rate(shade_tree_gateway_slashes_total{job="shade-tree-gateway"}[15m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Elevated slash rate on {{ $labels.instance }}"
          description: >-
            rate(shade_tree_gateway_slashes_total[15m]) = {{ printf "%.3f" $value }}/s on
            {{ $labels.instance }} for >10m. A slash is the rate limit working (an RLN over-spend
            caught), not a failure, so this never spends error budget. Investigate the cause: a
            misbehaving client re-using a nullifier, or an attacker probing. Do NOT treat as an
            availability incident. Runbook: docs/INCIDENT.md #7.

      # Overall drop fraction. Gate DROPs are correct rejections and do NOT count against
      # egress-success (SLO.md 2.1), so this alert is a SIGNAL to inspect the reason mix, not
      # proof of an outage. A spike concentrated in root-not-recent across many nullifiers is
      # the false-DROP / config-mismatch signal (INCIDENT.md #6), not a capacity problem.
      # Guarded by a minimum tunnel-attempt rate so a quiet gateway does not fire on noise.
      - alert: HighDropRate
        expr: >-
          (
            sum by (instance) (rate(shade_tree_gateway_tunnels_total{job="shade-tree-gateway", result="drop"}[10m]))
            /
            clamp_min(sum by (instance) (rate(shade_tree_gateway_tunnels_total{job="shade-tree-gateway"}[10m])), 1e-9)
          ) > 0.5
          and
          sum by (instance) (rate(shade_tree_gateway_tunnels_total{job="shade-tree-gateway"}[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Drop fraction > 50% on {{ $labels.instance }}"
          description: >-
            Over 10m, >50% of tunnel attempts to {{ $labels.instance }} were dropped (with non-trivial
            volume). Gate DROPs are correct rejections, so first read the drop-reason breakdown on
            the Shade Tree dashboard. A root-not-recent spike is a gate/config mismatch: align
            SHADE_TREE_EPOCH_SECONDS / SHADE_TREE_SLOTS / SHADE_TREE_RLN_IDENTIFIER / root source and widen
            SHADE_TREE_FRESHNESS_ROOTS (docs/INCIDENT.md #6, docs/SLO.md section 3). Dial/upstream-style
            drops instead point at capacity: add gateways. Do NOT slash for these.

      # Server-side verifyEnvelope latency vs SLO 2.4 (p95 < 50ms, p99 < 100ms, 7d). Uses the
      # histogram buckets. This is verify CPU only, not end-to-end (Tor RTT is excluded by design).
      # Sustained breach means the per-core verify ceiling (~30/s/core) is near: add cores/gateways,
      # NEVER skip or weaken a verify check to buy latency (SLO.md section 5 hard line).
      - alert: VerifyLatencyP95High
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le, instance) (rate(shade_tree_gateway_verify_seconds_bucket{job="shade-tree-gateway"}[5m]))
          ) > 0.05
        for: 15m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "verifyEnvelope p95 > 50ms on {{ $labels.instance }}"
          description: >-
            p95 of shade_tree_gateway_verify_seconds = {{ printf "%.3f" $value }}s on
            {{ $labels.instance }} for >15m, over the SLO 2.4 target of 50ms. This is server-side
            proof-verify CPU only. Approaching the ~30 verifies/sec/core ceiling: add cores or
            gateways before backpressure turns into failed tunnels. Never buy latency by skipping
            a verify check (docs/SLO.md 2.4 + section 5).

      - alert: VerifyLatencyP99High
        expr: >-
          histogram_quantile(
            0.99,
            sum by (le, instance) (rate(shade_tree_gateway_verify_seconds_bucket{job="shade-tree-gateway"}[5m]))
          ) > 0.1
        for: 15m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "verifyEnvelope p99 > 100ms on {{ $labels.instance }}"
          description: >-
            p99 of shade_tree_gateway_verify_seconds = {{ printf "%.3f" $value }}s on
            {{ $labels.instance }} for >15m, over the SLO 2.4 target of 100ms. Tail verify latency
            is climbing; check for GC/scheduling jitter or verify-throughput saturation, and add
            capacity. Runbook: docs/SLO.md 2.4, error-budget section 3.

  - name: shade-tree-heartbeat
    rules:
      # A running Node may still disappear from the Canopy when its announce loop cannot reach
      # the Elder. This catches that split-brain state before the local process itself exits.
      - alert: HeartbeatStale
        expr: >-
          shade_tree_heartbeat_last_success_timestamp_seconds{job="shade-tree-heartbeat"} > 0
          and on(instance)
          (time() - shade_tree_heartbeat_last_success_timestamp_seconds{job="shade-tree-heartbeat"}) > 900
          and on(instance) up{job="shade-tree-heartbeat"} == 1
        for: 5m
        labels:
          severity: critical
          component: heartbeat
        annotations:
          summary: "Node heartbeat is stale on {{ $labels.instance }}"
          description: >-
            The heartbeat process is scrapeable, but its last accepted announce was more than
            15 minutes ago. Check Tor reachability, the Elder address, egress self-check, and
            announce rejection logs. Adjust the threshold if the heartbeat interval is above
            the default five minutes.

      - alert: HeartbeatNeverAccepted
        expr: >-
          shade_tree_heartbeat_last_success_timestamp_seconds{job="shade-tree-heartbeat"} == 0
          and on(instance)
          (time() - shade_tree_process_start_time_seconds{job="shade-tree-heartbeat"}) > 900
          and on(instance) up{job="shade-tree-heartbeat"} == 1
        for: 5m
        labels:
          severity: critical
          component: heartbeat
        annotations:
          summary: "Node heartbeat has never been accepted on {{ $labels.instance }}"
          description: >-
            The heartbeat process has run for more than 15 minutes without one accepted
            announce. Check Tor reachability, the Elder address and signer, egress self-check,
            and announce rejection logs.

      - alert: HeartbeatDown
        expr: up{job="shade-tree-heartbeat"} == 0
        for: 5m
        labels:
          severity: warning
          component: heartbeat
        annotations:
          summary: "Heartbeat metrics are unavailable on {{ $labels.instance }}"
          description: >-
            Prometheus cannot scrape the loopback heartbeat endpoint. Check
            shade-tree-heartbeat.service and local port 9103. Fleet membership will age out if
            announces are also stopped.
