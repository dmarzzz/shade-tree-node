# Local demo fleet for Shade Tree.
#
# Topology: one `tor` service fronts two v3 onion services and LENDS its network
# namespace to the backend containers. The shade-tree processes (bootnode, gateway,
# client shim) all bind loopback only — 127.0.0.1 — with no host-override in the
# source, so a plain bridge network can't reach them from a separate tor box.
# `network_mode: "service:tor"` puts them on tor's loopback instead, which is
# also exactly how the real single-host deploy works (tor + app share 127.0.0.1).
# Consequence: those services can't declare their own ports/networks; all port
# publishing happens on `tor`, and they reach each other + SOCKS at 127.0.0.1.
#
# Onion addresses are generated on tor's FIRST boot (~10-30s to also publish
# their descriptors to the network). tor mirrors the hostnames to the `onions`
# volume as bootnode.onion / gateway.onion; the client reads bootnode.onion from
# there automatically. See docker/README.md for the run + gotchas.

services:
  # --- Tor: SOCKS + two hidden services; owns the shared network namespace ----
  tor:
    build:
      context: .
      dockerfile: docker/Dockerfile.tor
    image: shade-tree-tor:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=16m,mode=0755
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.50
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - torstate:/var/lib/tor        # private tor state + HS keys (0700)
      - onions:/shared               # world-readable onion-hostname mirror
    ports:
      - "127.0.0.1:9050:9050"        # loopback SOCKS, for host-side manual testing
    stop_grace_period: 30s
    restart: unless-stopped

  # --- Bootnode: gateway-discovery service, onion:80 -> 127.0.0.1:8877 --------
  bootnode:
    build: .
    image: shade-tree-node:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on: [tor]
    network_mode: "service:tor"      # share tor's loopback (see header)
    volumes:
      - bootnodedata:/data           # writable home for the minted signer key
    environment:
      SHADE_TREE_BOOTNODE_PORT: "8877"
      SHADE_TREE_BOOTNODE_ADMISSION: "open"        # demo: accept any announce
      SHADE_TREE_BOOTNODE_TTL: "900"
      SHADE_TREE_STAKE_MODE: "mock"                # demo: no on-chain stake checks
      SHADE_TREE_BOOTNODE_SIGNER_KEY: "/data/bootnode-signer.key"
    command: ["bootnode"]
    stop_grace_period: 20s
    restart: unless-stopped

  # --- Gateway: Shade Tree tunnel, onion:80 -> 127.0.0.1:8443 -----------------
  gateway:
    build: .
    image: shade-tree-node:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.75
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on: [tor, bootnode]
    network_mode: "service:tor"
    environment:
      # No SHADE_TREE_GROUP_CONTRACT in the demo -> gateway falls back to its local
      # members.json root source (see packages/node/gateway/gateway.mjs). Egress is direct
      # clearnet from the gateway; it does not use Tor SOCKS itself.
      SHADE_TREE_STAKE_MODE: "mock"
    command: ["gateway"]
    stop_grace_period: 30s
    restart: unless-stopped

  # --- Client: local HTTP-CONNECT shim -> Tor SOCKS -> gateway.onion ----------
  client:
    build: .
    image: shade-tree-node:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.75
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on: [tor, bootnode, gateway]
    network_mode: "service:tor"
    volumes:
      - onions:/shared:ro            # read the generated bootnode.onion
    environment:
      SHADE_TREE_TOR_HOST: "127.0.0.1"     # SOCKS is on tor's loopback (shared ns)
      SHADE_TREE_TOR_PORT: "9050"
      SHADE_TREE_SHIM_PORT: "8888"
      # Provide these before `up` (see docker/README.md):
      #   SHADE_TREE_SECRET     — a member secret from `shade-tree enroll`
      #   SHADE_TREE_DIR_SIGNER — the bootnode's pinned signer pubkey (printed at boot)
      SHADE_TREE_SECRET: "${SHADE_TREE_SECRET:-}"
      SHADE_TREE_DIR_SIGNER: "${SHADE_TREE_DIR_SIGNER:-}"
    # Wait for the onion to exist, export it, then start the shim. The shim binds
    # 127.0.0.1:8888 inside tor's namespace, so drive it with:
    #   docker compose exec client curl -x http://127.0.0.1:8888 https://api.ipify.org
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -s /shared/bootnode.onion ]; do
          echo "client: waiting for bootnode onion..."; sleep 2;
        done
        export SHADE_TREE_BOOTNODE_ONION="$(cat /shared/bootnode.onion)"
        echo "client: bootnode onion = $$SHADE_TREE_BOOTNODE_ONION"
        exec node /app/packages/node/bin/shade-tree.mjs client
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  torstate:      # tor DataDirectory: HS private keys + descriptors (persist onions)
  onions:        # world-readable mirror of the generated onion hostnames
  bootnodedata:  # bootnode signer key
