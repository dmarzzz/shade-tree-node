# Dependabot: weekly dependency + toolchain update PRs (T-HARD-2 supply chain).
# Covers the three ecosystems this repo ships: npm (root), cargo (repo root, crates/), and
# the GitHub Actions pinned in the workflows themselves.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The arkworks crates, ark-circom and num-bigint must move together: ark-circom 0.5 ==
    # ark 0.5 (crates/shadenet-rln/Cargo.toml), and a lone major bump can't compile. Group
    # them into one PR and leave majors to a deliberate upgrade.
    groups:
      arkworks:
        patterns:
          - "ark-*"
          - "num-bigint"
    ignore:
      - dependency-name: "ark-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "num-bigint"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
