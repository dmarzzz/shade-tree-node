name: site-deployment-smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      origin:
        description: Deployment origin to test
        required: false
        default: https://shade-tree-node.vercel.app

permissions:
  contents: read

concurrency:
  group: site-smoke-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    name: deployment smoke
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_BASE_URL: ${{ inputs.origin || github.event.deployment_status.target_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify pages, assets, APIs, 404, and security headers
        run: node scripts/site-smoke.mjs
