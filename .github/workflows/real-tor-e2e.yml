name: real-tor-e2e

# T-TEST-1: real-Tor END-TO-END member tunnel. It boots the SAME systemd-container fleet as
# bootstrap-e2e (bootnode/deploy/bootstrap.sh -> tor + shade-tree-bootnode + shade-tree-gateway with REAL
# published v3 onions), then runs the JS REFERENCE client (client/shade-tree-client.mjs, driven by
# test/real-tor-e2e-client.mjs): it mints a real per-tunnel RLN membership proof and dials the
# gateway's .onion over the container's Tor SOCKS, and the real gateway must ACCEPT and proxy the
# CONNECT to a local sink.
#
# GATING: v3 HS descriptor propagation over the live Tor network is slow + flaky, so the runner
# treats a propagation timeout as a SOFT/NEUTRAL outcome (the job still passes), identical to how
# bootstrap-e2e treats its over-Tor dial. A genuine ACCEPT is asserted (client ok ack + the node's
# loopback pass metric + the sink actually receiving the tunneled connection); a client that claims
# ACCEPT without that corroborating evidence is a HARD failure. This job does NOT gate the existing
# ci.yml suites — it is an additional, best-effort integration signal.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "bootnode/**"
      - "gateway/**"
      - "client/**"
      - "lib/**"
      - "group/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "test/real-tor-e2e-client.mjs"
      - "test/real-tor-e2e-container.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/real-tor-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-tor-e2e:
    name: real-Tor client tunnel e2e (systemd fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # ubuntu-latest ships Docker and can run privileged containers (systemd-in-container).
      # The runner boots the fleet, then runs the JS client egress over Tor and asserts the
      # ACCEPT; a propagation timeout is a soft pass (see the script header + E2E-CONTAINER.md).
      - name: Real-Tor JS client -> fleet gateway ACCEPT (over Tor)
        run: bash test/real-tor-e2e-container.sh

  rust-real-tor-e2e:
    name: Rust embedded-Tor -> JS gateway ACCEPT (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies and Tor
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y tor

      # Unlike the historical JS fleet probe's soft descriptor-propagation result,
      # Rust maturity requires a real ACCEPT. The harness retries descriptor fetches
      # and exits nonzero if embedded Arti never reaches the published onion.
      - name: Rust embedded-Tor client -> JavaScript gateway ACCEPT
        env:
          SHADE_TREE_TOR_E2E: "1"
          SHADE_TREE_TOR_DIAL_ATTEMPTS: "5"
          SHADE_TREE_TOR_TIMEOUT_SECS: "300"
        run: bash crates/shadenet-rln/interop/egress-tor-run.sh
