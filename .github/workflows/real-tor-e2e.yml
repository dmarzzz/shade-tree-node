name: real-tor-e2e

# T-TEST-1: real-Tor END-TO-END member tunnel. It boots the SAME systemd-container fleet as
# bootstrap-e2e (packages/node/bootnode/deploy/bootstrap.sh -> tor + shade-tree-bootnode + shade-tree-gateway with REAL
# published v3 onions), then runs the JS REFERENCE client (packages/node/client/shade-tree-client.mjs, driven by
# test/real-tor-e2e-client.mjs): it mints a real per-tunnel RLN membership proof and dials the
# gateway's .onion over the container's Tor SOCKS, and the real gateway must ACCEPT and proxy the
# CONNECT to a local sink.
#
# GATING: v3 HS descriptor propagation over the live Tor network is slow + flaky, so the runner
# treats a propagation timeout as a SOFT/NEUTRAL outcome (the job still passes), identical to how
# bootstrap-e2e treats its over-Tor dial. A genuine ACCEPT is asserted (client ok ack + the node's
# loopback pass metric + the sink actually receiving the tunneled connection); a client that claims
# ACCEPT without that corroborating evidence is a HARD failure.
#
# Both jobs are required checks on main: the fleet run and the Rust embedded-Tor run (HYG-10,
# the one end-to-end test of the product agents run). The workflow triggers on every PR and
# the `changes` gate turns both into a fast success when a PR touches nothing they exercise,
# so the required checks always report. main, the nightly and dispatch always run them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: e2e path gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|packages/node/|group/|circuits/|testdata/|network/|package(-lock)?\.json$|test/real-tor-e2e|\.github/workflows/real-tor-e2e\.yml$|scripts/ci-changes\.sh$)'

  real-tor-e2e:
    name: real-Tor client tunnel e2e (systemd fleet)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: No e2e inputs changed
        if: needs.changes.outputs.run != 'true'
        run: echo "No e2e input changed in this PR; reporting success without running Tor."

      # ubuntu-latest ships Docker and can run privileged containers (systemd-in-container).
      # The runner boots the fleet, then runs the JS client egress over Tor and asserts the
      # ACCEPT; a propagation timeout is a soft pass (see the script header + E2E-CONTAINER.md).
      - name: Real-Tor JS client -> fleet gateway ACCEPT (over Tor)
        if: needs.changes.outputs.run == 'true'
        run: bash test/real-tor-e2e-container.sh

  rust-real-tor-e2e:
    name: Rust embedded-Tor -> JS gateway ACCEPT (blocking)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: No e2e inputs changed
        if: needs.changes.outputs.run != 'true'
        run: echo "No e2e input changed in this PR; reporting success without running Tor."

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: needs.changes.outputs.run == 'true'
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.run == 'true'
        with:
          shared-key: e2e

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies and Tor
        if: needs.changes.outputs.run == 'true'
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y tor

      # Unlike the historical JS fleet probe's soft descriptor-propagation result,
      # Rust maturity requires a real ACCEPT. The harness retries descriptor fetches
      # and exits nonzero if embedded Arti never reaches the published onion.
      - name: Rust embedded-Tor client -> JavaScript gateway ACCEPT
        if: needs.changes.outputs.run == 'true'
        env:
          SHADE_TREE_TOR_E2E: "1"
          SHADE_TREE_TOR_DIAL_ATTEMPTS: "5"
          SHADE_TREE_TOR_TIMEOUT_SECS: "300"
        run: bash crates/shadenet-rln/interop/egress-tor-run.sh
