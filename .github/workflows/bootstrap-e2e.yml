name: bootstrap-e2e

# T-TEST-8: prove bootnode/deploy/bootstrap.sh actually brings a fleet up, instead of
# being hand-run once. It runs the SAME local runner a developer uses
# (bootnode/deploy/e2e-container.sh): boot ubuntu:24.04 with real systemd as PID 1,
# run bootstrap.sh against this checkout, and assert tor + the shade-tree units are active,
# both onion hostname files were written, and the bootnode answers /health on loopback.
# Reaching the onion over the live Tor network is attempted best-effort (non-fatal).
# A second matrix entry runs the same container in bootstrap.sh's GATEWAY-ONLY mode
# (SHADE_TREE_BOOTNODE_ONION set -> no bootnode unit / HS, heartbeat -> the remote onion; T-DEPLOY-5
# GAP-6). See bootnode/deploy/E2E-CONTAINER.md for the systemd-in-container rationale +
# honest coverage notes.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "bootnode/**"
      - "gateway/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bootstrap-e2e.yml"
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-e2e:
    name: deploy bootstrap e2e (systemd container, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [bootnode+gateway, gateway-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # ubuntu-latest ships Docker and can run privileged containers, which is what
      # systemd-in-container needs. The runner script does everything else.
      - name: Run bootstrap.sh e2e in a systemd container (${{ matrix.mode }})
        env:
          E2E_MODE: ${{ matrix.mode }}
        run: bash bootnode/deploy/e2e-container.sh
