name: bootstrap-e2e

# T-TEST-8: prove packages/node/bootnode/deploy/bootstrap.sh actually brings a fleet up, instead of
# being hand-run once. It runs the SAME local runner a developer uses
# (packages/node/bootnode/deploy/e2e-container.sh): boot ubuntu:24.04 with real systemd as PID 1,
# run bootstrap.sh against this checkout, and assert tor + the shade-tree units are active,
# both onion hostname files were written, and the bootnode answers /health on loopback.
# Reaching the onion over the live Tor network is attempted best-effort (non-fatal).
# A second matrix entry runs the same container in bootstrap.sh's GATEWAY-ONLY mode
# (SHADE_TREE_BOOTNODE_ONION set -> no bootnode unit / HS, heartbeat -> the remote onion; T-DEPLOY-5
# GAP-6). See packages/node/bootnode/deploy/E2E-CONTAINER.md for the systemd-in-container rationale +
# honest coverage notes.

on:
  push:
    branches: [main]
  # Runs on every PR so its two matrix checks always report (they are required). The gate
  # step below turns a PR that touches no bootstrap input into a fast success; a job-level
  # `if:` would skip under the unexpanded matrix name and never report the required contexts.
  pull_request:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bootstrap-e2e:
    name: deploy bootstrap e2e (systemd container, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [bootnode+gateway, gateway-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Path gate
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|packages/node/|group/|network/|tor/|package(-lock)?\.json$|\.github/workflows/bootstrap-e2e\.yml$|scripts/ci-changes\.sh$)'

      - name: No bootstrap inputs changed
        if: steps.gate.outputs.run != 'true'
        run: echo "No bootstrap input changed in this PR; reporting success without booting the fleet."

      # The units run the shadenet-node and shadenet-elder binaries; the runner script builds
      # them from this checkout and hands them to bootstrap.sh in place of a release download.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.gate.outputs.run == 'true'
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.run == 'true'

      # ubuntu-latest ships Docker and can run privileged containers, which is what
      # systemd-in-container needs. The runner script does everything else.
      - name: Run bootstrap.sh e2e in a systemd container (${{ matrix.mode }})
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_MODE: ${{ matrix.mode }}
          # GitHub's Ubuntu runners reach Azure's Ubuntu mirror quickly; archive.ubuntu.com
          # stalled apt inside the container for minutes on 2026-10-07, and Azure's did on
          # 2026-10-27. Each failed apt attempt moves to the next mirror.
          E2E_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/
        run: bash packages/node/bootnode/deploy/e2e-container.sh
