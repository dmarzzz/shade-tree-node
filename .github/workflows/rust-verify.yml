name: rust-verify

# One reusable Rust gate for pull requests and release tags. Keeping the commands
# here prevents the release workflow from silently testing less than CI.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: check and test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace

      - name: Assert package versions agree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open("package.json", encoding="utf-8") as package_file:
              package_version = json.load(package_file)["version"]

          metadata = json.loads(
              subprocess.check_output(
                  [
                      "cargo",
                      "metadata",
                      "--manifest-path",
                      "Cargo.toml",
                      "--no-deps",
                      "--format-version",
                      "1",
                  ],
                  text=True,
              )
          )
          mismatches = [
              f'{package["name"]}={package["version"]}'
              for package in metadata["packages"]
              if package["version"] != package_version
          ]
          if mismatches:
              raise SystemExit(
                  "Rust workspace versions must match package.json "
                  f'({package_version}): {", ".join(mismatches)}'
              )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag_version = ref.removeprefix("refs/tags/v")
              if tag_version != package_version:
                  raise SystemExit(
                      f"Release tag v{tag_version} does not match package version "
                      f"{package_version}"
                  )

          print(f"package.json and all Rust crates: {package_version}")
          PY

      - name: Check workspace (all targets and features)
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Test workspace (all features)
        run: cargo test --workspace --all-features --locked

      - name: Set up Node for cross-implementation verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript reference dependencies
        run: npm ci

      - name: Rust proof -> JavaScript verifier interop (blocking)
        run: bash crates/shadenet-rln/interop/run.sh

      - name: Rust client -> JavaScript gateway + payload relay (blocking)
        run: bash crates/shadenet-rln/interop/egress-run.sh

      - name: Rust CONNECT Proxy -> JavaScript gateway + early payload (blocking)
        run: bash crates/shadenet-rln/interop/proxy-run.sh
