name: uptime-probe

# T-DEPLOY-5 / GAP-8 (docs/history/GO-LIVE.md row 6.3): a hosted, tor-capable runner for
# scripts/uptime-probe.mjs — the SLI source for docs/SLO.md 2.2/2.3 (monitoring/UPTIME.md).
#
# It installs tor on the runner, waits for it to bootstrap, then runs the probe OVER TOR against
# the bootnode onion, verifying the served directory against the pinned signer. Configuration
# comes from repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   SHADE_TREE_BOOTNODE_ONION   the fleet bootnode's v3 .onion
#   SHADE_TREE_DIR_SIGNER       the pinned directory-signer pubkey (hex, no 0x)
#   SHADE_TREE_NETWORK          ALTERNATIVE: a network/<name>/ record name (e.g. sepolia); the probe reads
#                         the two values above from network/<name>/bootnode.json (packages/node/lib/network-record.mjs)
#   SHADE_TREE_PROBE_ACCEPT_PRE_V4_CAPS  keep 0 for the current v4 Grove; 1 is observation-only
#                         compatibility for an explicitly identified legacy fleet
#   SHADE_TREE_GROVE_SIGNING_KEY  dedicated Ed25519 private key, stored only as an Actions secret
# The onion and signer are not secret, so plain variables are the right home; the same names are
# also read from SECRETS as a fallback. The Grove signing key is secret. The hosted probe never
# prints the count and scrubs onions from error text. After a fresh, verified
# probe, the workflow force-updates the generated network-state branch with versioned allowlisted
# signed aggregate snapshots for the public Grove. No directory rows are written to that branch.
# A final read-only job verifies the production page and both public signed heads.
#
# FRESHNESS GUARD: the probe can be green while nothing is published (wrong SHADE_TREE_NETWORK,
# repeated UNKNOWN runs, a publisher that never starts). The `freshness` job runs on every run
# of a repository that holds the signing key, reads the published snapshots back from the
# network-state branch (scripts/grove-freshness.mjs) and annotates the run with a warning once
# the newest one is three cadences old, and fails once it is eight cadences old. It is a
# separate job: the `probe` job's result still means only "Elder reachable, directory verified".
#
# NO-OP GUARD: if none of the variables/secrets is set, the job writes a ::notice:: and exits
# green without installing anything, so an unconfigured fork/repo never red-flags. Only a real
# CRITICAL probe (bootnode unreachable / signer mismatch) fails the run.
#
# Cadence: */15. GitHub's floor is */5, but scheduled runs are queued best-effort (often minutes
# late, dropped under load), so this workflow is the coarse hosted signal; the 5-minute SLI cadence
# is the systemd timer in monitoring/uptime/ on an operator-owned tor box.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: fleet uptime probe (over Tor)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      grove_snapshot: ${{ steps.grove.outputs.snapshot }}
      grove_v2_snapshot: ${{ steps.grove.outputs.snapshot_v2 }}
    env:
      SHADE_TREE_BOOTNODE_ONION: ${{ vars.SHADE_TREE_BOOTNODE_ONION || secrets.SHADE_TREE_BOOTNODE_ONION }}
      SHADE_TREE_DIR_SIGNER: ${{ vars.SHADE_TREE_DIR_SIGNER || secrets.SHADE_TREE_DIR_SIGNER }}
      SHADE_TREE_NETWORK: ${{ vars.SHADE_TREE_NETWORK || secrets.SHADE_TREE_NETWORK }}
      SHADE_TREE_PROBE_ACCEPT_PRE_V4_CAPS: ${{ vars.SHADE_TREE_PROBE_ACCEPT_PRE_V4_CAPS }}
      SHADE_TREE_TOR_HOST: 127.0.0.1
      SHADE_TREE_TOR_PORT: 9050
    steps:
      - name: check configuration (no-op when unset)
        id: cfg
        run: |
          if [ -n "$SHADE_TREE_BOOTNODE_ONION" ] && [ -n "$SHADE_TREE_DIR_SIGNER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "probe target: bootnode onion + pinned signer from repository variables"
          elif [ -n "$SHADE_TREE_NETWORK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "probe target: network/$SHADE_TREE_NETWORK/bootnode.json (SHADE_TREE_NETWORK)"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=uptime-probe skipped::SHADE_TREE_BOOTNODE_ONION + SHADE_TREE_DIR_SIGNER (or SHADE_TREE_NETWORK) are not set as repository variables; nothing to probe. See monitoring/UPTIME.md."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.cfg.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      - name: resolve network record (SHADE_TREE_NETWORK)
        if: steps.cfg.outputs.configured == 'true' && env.SHADE_TREE_NETWORK != ''
        run: |
          # A pending record (onion null) means there is nothing to probe yet: say so and stop green.
          out="$(node -e '
            import("./packages/node/lib/network-record.mjs").then((m) => {
              if (process.env.SHADE_TREE_BOOTNODE_ONION && process.env.SHADE_TREE_DIR_SIGNER) {
                console.log("resolved");
                return;
              }
              const d = m.networkEnvDefaults(process.env.SHADE_TREE_NETWORK);
              const has = Boolean(d.SHADE_TREE_BOOTNODE_ONION) && Boolean(d.SHADE_TREE_DIR_SIGNER);
              console.log(has ? "resolved" : "pending");
            }).catch((e) => { console.error(e.message); process.exit(1); });
          ')"
          echo "record: $out"
          if [ "$out" != "resolved" ]; then
            echo "::notice title=uptime-probe skipped::network/$SHADE_TREE_NETWORK/bootnode.json has no live bootnode onion/signer yet (status pending); nothing to probe."
            echo "SHADE_TREE_PROBE_SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: install + bootstrap tor
        if: steps.cfg.outputs.configured == 'true' && env.SHADE_TREE_PROBE_SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor >/dev/null
          sudo systemctl stop tor >/dev/null 2>&1 || true
          for attempt in 1 2; do
            tor_dir="$RUNNER_TEMP/tor-$attempt"
            tor_log="$RUNNER_TEMP/tor-$attempt.log"
            mkdir -p "$tor_dir"
            nohup tor --SocksPort 9050 --DataDirectory "$tor_dir" --Log "notice stdout" > "$tor_log" 2>&1 &
            tor_pid=$!
            for i in $(seq 1 90); do
              if grep -q "Bootstrapped 100%" "$tor_log" 2>/dev/null; then
                echo "tor bootstrapped on attempt $attempt after ~${i}s"
                exit 0
              fi
              sleep 1
            done
            kill "$tor_pid" >/dev/null 2>&1 || true
            wait "$tor_pid" >/dev/null 2>&1 || true
            echo "tor bootstrap attempt $attempt/2 did not complete in 90s"
          done
          # Runner-side Tor failure says nothing about the canopy (OPS-7): report UNKNOWN, skip
          # the probe and the snapshot, and keep the run green so it never pages as an outage.
          echo "tor did not bootstrap after two clean attempts"
          tail -n 20 "$RUNNER_TEMP/tor-2.log"
          echo "::warning title=uptime-probe UNKNOWN::runner Tor did not bootstrap; canopy state not measured this run"
          echo "UNKNOWN: runner Tor did not bootstrap" >> "$GITHUB_STEP_SUMMARY"
          echo "SHADE_TREE_PROBE_SKIP=1" >> "$GITHUB_ENV"
          exit 0

      - name: probe (over Tor, signer-pinned)
        if: steps.cfg.outputs.configured == 'true' && env.SHADE_TREE_PROBE_SKIP != '1'
        run: |
          set +e
          line="$(node scripts/uptime-probe.mjs --format nagios)"
          rc=$?
          set -e
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=uptime-probe UNKNOWN::$line"
            echo "SHADE_TREE_PROBE_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error title=uptime-probe CRITICAL::$line"
            exit "$rc"
          fi
          case "$line" in *"differs from the record pin"*) echo "::warning title=canopy pin drift::$line" ;; esac

      - name: load previous public Grove snapshot
        if: steps.cfg.outputs.configured == 'true' && env.SHADE_TREE_PROBE_SKIP != '1'
        run: |
          : > "$RUNNER_TEMP/grove.previous.json"
          : > "$RUNNER_TEMP/grove-v2.previous.json"
          if git fetch --quiet --no-tags origin refs/heads/network-state:refs/remotes/origin/network-state 2>/dev/null; then
            git show refs/remotes/origin/network-state:grove.json > "$RUNNER_TEMP/grove.previous.json" 2>/dev/null || true
            git show refs/remotes/origin/network-state:grove-v2.json > "$RUNNER_TEMP/grove-v2.previous.json" 2>/dev/null || true
          fi

      - name: build aggregate-only public Grove snapshot
        id: grove
        if: steps.cfg.outputs.configured == 'true' && env.SHADE_TREE_PROBE_SKIP != '1'
        env:
          SHADE_TREE_GROVE_SIGNING_KEY: ${{ secrets.SHADE_TREE_GROVE_SIGNING_KEY }}
        run: |
          if [ -z "$SHADE_TREE_GROVE_SIGNING_KEY" ]; then
            echo "::notice title=public Grove skipped::SHADE_TREE_GROVE_SIGNING_KEY is not configured; uptime probe completed without publishing a snapshot."
            exit 0
          fi
          if [ "${SHADE_TREE_NETWORK:-}" != "sepolia" ]; then
            # A warning, not a notice: the signing key is configured, so this repository is the
            # publisher, and every run that lands here leaves the public page one cadence staler.
            echo "::warning title=public Grove NOT published::SHADE_TREE_NETWORK must be sepolia for the versioned Sepolia Data API; the uptime probe completed without replacing the last valid snapshot. Set the repository variable SHADE_TREE_NETWORK to sepolia to resume publishing."
            echo "Public Grove NOT published: SHADE_TREE_NETWORK is not sepolia." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/grove-snapshot.mjs \
            --network sepolia \
            --previous "$RUNNER_TEMP/grove.previous.json" \
            --out "$RUNNER_TEMP/grove.json"
          node scripts/grove-snapshot.mjs \
            --network sepolia \
            --previous "$RUNNER_TEMP/grove-v2.previous.json" \
            --relay 1 \
            --out "$RUNNER_TEMP/grove-v2.json"
          echo "snapshot=$(base64 -w0 "$RUNNER_TEMP/grove.json")" >> "$GITHUB_OUTPUT"
          echo "snapshot_v2=$(base64 -w0 "$RUNNER_TEMP/grove-v2.json")" >> "$GITHUB_OUTPUT"

  publish:
    name: publish signed aggregate
    needs: probe
    if: needs.probe.outputs.grove_snapshot != '' && needs.probe.outputs.grove_v2_snapshot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # This job deliberately checks out no code and runs no action. It receives only signed,
      # base64-encoded JSON blobs and constructs a parentless commit with the two snapshots plus
      # a minimal Vercel config that disables deployments for this generated branch.
      - name: publish generated network state
        env:
          GROVE_SNAPSHOT_B64: ${{ needs.probe.outputs.grove_snapshot }}
          GROVE_V2_SNAPSHOT_B64: ${{ needs.probe.outputs.grove_v2_snapshot }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          version="X-GitHub-Api-Version: 2022-11-28"

          blob_payload="$(jq -n --arg content "$GROVE_SNAPSHOT_B64" '{content:$content,encoding:"base64"}')"
          blob_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/blobs" -d "$blob_payload" | jq -er .sha)"
          blob_v2_payload="$(jq -n --arg content "$GROVE_V2_SNAPSHOT_B64" '{content:$content,encoding:"base64"}')"
          blob_v2_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/blobs" -d "$blob_v2_payload" | jq -er .sha)"
          vercel_config='{"git":{"deploymentEnabled":{"network-state":false}}}'
          vercel_blob_payload="$(jq -n --arg content "$vercel_config" '{content:$content,encoding:"utf-8"}')"
          vercel_blob_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/blobs" -d "$vercel_blob_payload" | jq -er .sha)"
          tree_payload="$(jq -n --arg sha "$blob_sha" --arg sha_v2 "$blob_v2_sha" --arg vercel_sha "$vercel_blob_sha" '{tree:[{path:"grove.json",mode:"100644",type:"blob",sha:$sha},{path:"grove-v2.json",mode:"100644",type:"blob",sha:$sha_v2},{path:"docs/post/vercel.json",mode:"100644",type:"blob",sha:$vercel_sha}]}')"
          tree_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/trees" -d "$tree_payload" | jq -er .sha)"
          commit_payload="$(jq -n --arg tree "$tree_sha" '{message:"data: update public Grove snapshot",tree:$tree,parents:[]}')"
          commit_sha="$(curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/commits" -d "$commit_payload" | jq -er .sha)"

          ref_status="$(curl -sS -o "$RUNNER_TEMP/grove-ref.json" -w '%{http_code}' -H "$auth" -H "$accept" -H "$version" "$api/git/ref/heads/network-state")"
          if [ "$ref_status" = "200" ]; then
            ref_payload="$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:true}')"
            curl -fsS -X PATCH -H "$auth" -H "$accept" -H "$version" "$api/git/refs/heads/network-state" -d "$ref_payload" >/dev/null
          elif [ "$ref_status" = "404" ]; then
            ref_payload="$(jq -n --arg sha "$commit_sha" '{ref:"refs/heads/network-state",sha:$sha}')"
            curl -fsS -X POST -H "$auth" -H "$accept" -H "$version" "$api/git/refs" -d "$ref_payload" >/dev/null
          else
            echo "unexpected network-state ref response: $ref_status" >&2
            exit 1
          fi

  verify-public:
    name: verify public Grove data plane
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: verify production page and signed heads
        env:
          GROVE_ORIGIN: https://shadenet.xyz
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            page_status="$(curl -sS -o "$RUNNER_TEMP/grove-page.html" -w '%{http_code}' "$GROVE_ORIGIN/grove/")"
            v1_status="$(curl -sS -o "$RUNNER_TEMP/grove-v1.json" -w '%{http_code}' "$GROVE_ORIGIN/api/v1/data/grove/sepolia/head")"
            v2_status="$(curl -sS -o "$RUNNER_TEMP/grove-v2.json" -w '%{http_code}' "$GROVE_ORIGIN/api/v2/data/grove/sepolia/head")"
            page_ok=false
            v1_schema=""
            v2_schema=""
            if [ "$page_status" = "200" ] && grep -q 'id="grove-main"' "$RUNNER_TEMP/grove-page.html"; then page_ok=true; fi
            if [ "$v1_status" = "200" ]; then v1_schema="$(jq -r '.schema // empty' "$RUNNER_TEMP/grove-v1.json")"; fi
            if [ "$v2_status" = "200" ]; then v2_schema="$(jq -r '.schema // empty' "$RUNNER_TEMP/grove-v2.json")"; fi
            if [ "$page_ok" = "true" ] && [ "$v1_schema" = "shade-tree-public-grove-v1" ] && [ "$v2_schema" = "shade-tree-public-grove-v2" ]; then
              echo "public Grove page and signed v1/v2 heads are healthy"
              echo "Public Grove page and signed v1/v2 heads: healthy" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "public data plane not ready (attempt $attempt/12; page=$page_status v1=$v1_status v2=$v2_status)"
            sleep 5
          done
          echo "::error title=public Grove data plane unhealthy::The publisher succeeded, but the production Grove page or a signed Data API head did not become healthy within 60 seconds."
          exit 1

  freshness:
    name: public snapshot freshness
    needs: [probe, publish]
    # always(): the case this job exists for is a run where `publish` was skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: check publisher configuration (no-op without the signing key)
        id: cfg
        env:
          # Only the boolean reaches this job; the key itself stays scoped to the build step.
          HAS_GROVE_KEY: ${{ secrets.SHADE_TREE_GROVE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_GROVE_KEY" = "true" ]; then
            echo "publisher=true" >> "$GITHUB_OUTPUT"
          else
            echo "publisher=false" >> "$GITHUB_OUTPUT"
            echo "SHADE_TREE_GROVE_SIGNING_KEY is not configured; this repository does not publish the public Grove, so there is no snapshot age to check."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.cfg.outputs.publisher == 'true'
        with:
          persist-credentials: false

      - name: check the age of the published snapshot
        if: steps.cfg.outputs.publisher == 'true'
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          SHADE_TREE_NETWORK: ${{ vars.SHADE_TREE_NETWORK || secrets.SHADE_TREE_NETWORK }}
          # Three and eight 15-minute cadences. The v2 Data API rejects a snapshot older than 60
          # minutes, so the warning comes first. GROVE_STALE_FAIL_MINUTES=0 keeps it warning-only.
          GROVE_STALE_WARN_MINUTES: 45
          GROVE_STALE_FAIL_MINUTES: 120
        run: |
          : > "$RUNNER_TEMP/grove.published.json"
          : > "$RUNNER_TEMP/grove-v2.published.json"
          if git fetch --quiet --no-tags origin refs/heads/network-state:refs/remotes/origin/network-state 2>/dev/null; then
            git show refs/remotes/origin/network-state:grove.json > "$RUNNER_TEMP/grove.published.json" 2>/dev/null || true
            git show refs/remotes/origin/network-state:grove-v2.json > "$RUNNER_TEMP/grove-v2.published.json" 2>/dev/null || true
          fi
          node scripts/grove-freshness.mjs \
            --v1 "$RUNNER_TEMP/grove.published.json" \
            --v2 "$RUNNER_TEMP/grove-v2.published.json" \
            --probe-result "$PROBE_RESULT" \
            --network-selector "$SHADE_TREE_NETWORK"
