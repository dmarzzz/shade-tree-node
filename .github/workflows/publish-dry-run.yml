name: publish-dry-run

# crates.io and npm publish rehearsal (RUST-13). Uploads nothing. Every crate and npm
# workspace is reported; the job fails only when a package that opts into publishing
# can't pass its dry run. See scripts/release/publish-dry-run.mjs.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "package.json"
      - "packages/**/package.json"
      - "scripts/release/publish-dry-run.mjs"
      - ".github/workflows/publish-dry-run.yml"
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: publish

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rehearse crates.io and npm publishing
        run: node scripts/release/publish-dry-run.mjs
