name: mutation

# Monthly Stryker run over the trust-critical JS (stryker.config.json scope). Informational:
# it publishes the score and HTML report so there is recent evidence (HYG-11); it never gates.

on:
  schedule:
    - cron: "13 8 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run mutation:test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-${{ github.run_id }}
          path: reports/mutation/
          if-no-files-found: warn
