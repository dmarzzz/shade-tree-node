name: site-quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-quality.yml"
      - ".lighthouserc.json"
      - "docs/post/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/serve-site.mjs"
      - "test/site.selftest.mjs"
      - "test/site-browser/**"
  # The main-branch ruleset requires this check for every pull request. Keep
  # the PR trigger unconditional so non-site changes cannot deadlock a merge;
  # the `changes` job skips the browser run when a PR touches no site input,
  # and a skipped job satisfies the required check (HYG-10).
  pull_request:
  # `update_snapshots: true` regenerates the visual baselines in this exact environment (the
  # Linux runner CI compares against) and uploads test/site-browser/__screenshots__ as the
  # artifact site-baselines-<run id>. It never commits. scripts/site-baselines.sh dispatches it on a
  # branch and downloads the result for review (docs/RELEASING.md "Visual baselines").
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate Playwright visual baselines on the CI runner and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: site path gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh '^(docs/post/|site-src/|docs-site/|web/|assets/|test/site|test/site-browser/|playwright\.config\.mjs$|scripts/serve-site\.mjs$|\.lighthouserc\.json$|package(-lock)?\.json$|\.github/workflows/site-quality\.yml$|scripts/ci-changes\.sh$)'

  quality:
    name: site quality
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run static site checks
        run: npm run test:site

      - name: Run browser, accessibility, and visual checks
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:site:browser

      - name: Regenerate visual baselines (dispatch with update_snapshots)
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --config=playwright.config.mjs --update-snapshots

      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-baselines-${{ github.run_id }}
          path: test/site-browser/__screenshots__/
          if-no-files-found: error
          retention-days: 14

      - name: Run Lighthouse budgets
        if: ${{ !inputs.update_snapshots }}
        run: npm run site:lighthouse

      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-quality-${{ github.run_id }}
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
