name: release

# Build the distributable `shade-tree` binary and attach it to a GitHub Release (T-RUST-4).
# SEPARATE from ci.yml, because tag pushes do not run that workflow. The shared
# rust-verify workflow is therefore a hard dependency of every packaging job.
#
# Two honest binary flavors:
#   - DEFAULT `shade-tree` (deterministic core: verify-directory / select / verify-receipt /
#     fetch-directory). Pure Rust, no native deps, so it CROSS-COMPILES cleanly to the full
#     target matrix (linux gnu+musl x64/arm64, macOS x64/arm64, windows x64). Linux cross is
#     done with cargo-zigbuild (zig supplies the cross linker); macOS/windows build on their
#     own runner. No embedded circuit artifacts, so it stays small.
#   - LIVE `shade-tree` (egress: RLN Groth16 prover via ark-circom->wasmer + embedded Tor via arti).
#     Heavy native deps are built on a runner with the target CPU architecture. GNU Linux,
#     macOS, and Windows use cargo directly; Linux musl uses cargo-zigbuild only for the libc/linker
#     boundary. In particular, aarch64 live builds run on GitHub's arm64 Linux runner rather than
#     cross-compiling wasmer from x86_64. The RLN circuit artifacts are `include_bytes!`'d in
#     (shadenet-rln `embedded-artifacts` feature, enabled by `shadenet-cli`'s `live`), so the
#     `live` binary is self-contained — no external circuit files are needed to egress.
#
# TESTNET-ONLY artifacts: the embedded ZK artifacts are from an UNTRUSTED testnet ceremony
# (docs/history/SHIP-PLAN.md T-HARD-1). A production release must re-embed audited artifacts.
#
# ARTIFACT LOCK GATE (T-HARD-8): `lock-check` runs test/zk-artifacts.selftest.mjs on the tagged
# commit and BOTH build jobs depend on it, so a tag can never package a `live` binary whose
# embedded circuits/rln/* drift from testdata/zk-artifacts.lock.json (the binary also re-checks
# its embedded bytes against the embedded lock at `egress` startup — crates/shadenet-rln/src/artifacts.rs).
#
# Assets are named `shadenet-<version>-<target>` (default) and `shadenet-<version>-<target>-live`
# (live), each with a `.sha256`, plus the same set under the `shade-tree-` prefix as an alias for
# one minor release (scripts/release/package.sh). Symbols are stripped by `[profile.release]`.
#
# Also: macOS binaries are signed and notarized when the Apple secrets exist
# (scripts/release/macos-notarize.sh); the publish job attaches a generated Homebrew formula
# (`shadenet.rb`); the image job builds ghcr.io/<owner>/shadenet from the musl live binaries.
# `workflow_dispatch` on any branch is the release rehearsal: it builds, smoke-tests and
# attests everything and publishes nothing.
#
# v0.1.1 release-fix notes (v0.1.0 shipped with 3 of 10 targets missing):
#   - Package: `shasum` does not exist on the windows runner's bash -> use `sha256sum` where
#     available (linux/windows) and `shasum -a 256` on macOS. Same "<hex>  <file>" format.
#   - live windows: rusqlite (arti's tor-dirmgr) linked the SYSTEM sqlite3.lib (LNK1181) ->
#     shade-tree-client's `live` now turns on `arti-client/static-sqlite` (bundled amalgamation),
#     which also drops the libsqlite3 dynamic dep from the linux/macos live binaries.
#   - live linux x64: wasmer-vm 4 references `__rust_probestack`, which rustc >= 1.89 no
#     longer exports -> shadenet-rln/src/prover.rs carries the compiler-builtins definition.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-verify:
    name: rust verification
    uses: ./.github/workflows/rust-verify.yml

  set-version:
    name: validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Full history is required for the tag -> origin/main ancestry check. checkout
      # fetch-depth: 0 fetches every branch and tag, including origin/main.
      - name: Check out tagged commit with full history
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node for the release policy check
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Require matching manifests, changelog, and protected-main ancestry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node scripts/release-check.mjs
          --tag "$RELEASE_TAG"
          --commit HEAD
          --main-ref origin/main
          --notes-output release-notes.md

      - name: Stage validated release notes
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ steps.v.outputs.version }}
          path: release-notes.md
          if-no-files-found: error

  # ------------------------------------------------------------------ artifact lock gate
  lock-check:
    name: zk-artifacts lock selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Recomputes sha256/size of every ZK artifact vs the lock, the Rust include_bytes!/
      # include_str! paths, the Solidity VK constants, and the artifact ids (T-HARD-8).
      - run: node test/zk-artifacts.selftest.mjs

  # ------------------------------------------------------------------ default (cross)
  default:
    name: default ${{ matrix.target }}
    needs: [set-version, lock-check, rust-verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # store provenance and SBOM attestations
      artifact-metadata: write # register the attested artifact metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (linux cross)
        if: ${{ matrix.cross }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - name: Install cargo-zigbuild (linux cross)
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-zigbuild

      - name: Build (cross via zigbuild)
        if: ${{ matrix.cross }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release -p shadenet-cli --target "$RELEASE_TARGET"

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --release -p shadenet-cli --target "$RELEASE_TARGET"

      - name: Sign and notarize (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: >-
          bash scripts/release/macos-notarize.sh
          "target/$RELEASE_TARGET/release/shadenet"
          "target/$RELEASE_TARGET/release/shade-tree"

      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_EXT: ${{ matrix.ext }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: bash scripts/release/package.sh "$RELEASE_TARGET" "$RELEASE_VERSION" "" "$RELEASE_EXT"

      - name: Generate SPDX SBOM (shadenet)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.package.outputs.shadenet }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.shadenet }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM (shade-tree alias)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.package.outputs.shade_tree }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.shade_tree }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.artifacts }}

      - name: Attest SBOM (shadenet)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.shadenet }}
          sbom-path: ${{ steps.package.outputs.shadenet }}.spdx.json

      - name: Attest SBOM (shade-tree alias)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.shade_tree }}
          sbom-path: ${{ steps.package.outputs.shade_tree }}.spdx.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shade-tree-${{ matrix.target }}
          path: dist/*

  # ------------------------------------------------------- live (target-architecture runners)
  live:
    name: live ${{ matrix.target }}
    needs: [set-version, lock-check, rust-verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # store provenance and SBOM attestations
      artifact-metadata: write # register the attested artifact metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, builder: native }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, builder: native }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, builder: zig }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, builder: zig }
          - { target: aarch64-apple-darwin, os: macos-latest, builder: native }
          # Intel Mac live build on an Intel runner: wasmer and arti stay on their native arch.
          - { target: x86_64-apple-darwin, os: macos-15-intel, builder: native }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, builder: native, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive # ensure circuits/rln/* is present for include_bytes!

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      # The Linux runner already matches the target CPU. Zig supplies the musl
      # libc/linker boundary without asking wasmer/ark-circom to cross CPU architectures.
      - name: Install zig (live musl)
        if: ${{ matrix.builder == 'zig' }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - name: Install cargo-zigbuild (live musl)
        if: ${{ matrix.builder == 'zig' }}
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-zigbuild

      - name: Build live (native, embedded artifacts)
        if: ${{ matrix.builder == 'native' }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --release -p shadenet-cli --features live --target "$RELEASE_TARGET"

      - name: Build live (musl via zigbuild, embedded artifacts)
        if: ${{ matrix.builder == 'zig' }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release -p shadenet-cli --features live --target "$RELEASE_TARGET"

      # Every live target uses a runner with the same CPU architecture, and the
      # musl assets are executable on their Linux builders. Catch a stale/default
      # CLI before packaging (notably a binary missing the npm-free agent surface).
      - name: Smoke-check live agent commands
        shell: bash
        env:
          RELEASE_EXT: ${{ matrix.ext }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          BIN="target/$RELEASE_TARGET/release/shade-tree$RELEASE_EXT"
          HELP="$("$BIN" --help)"
          grep -Eq '^[[:space:]]+enroll([[:space:]]|$)' <<<"$HELP"
          grep -Eq '^[[:space:]]+proxy-token([[:space:]]|$)' <<<"$HELP"
          grep -Eq '^[[:space:]]+proxy([[:space:]]|$)' <<<"$HELP"
          grep -Eq '^[[:space:]]+run([[:space:]]|$)' <<<"$HELP"
          TOKEN="$("$BIN" proxy-token)"
          [[ "$TOKEN" =~ ^[0-9a-f]{64}$ ]]
          NEW="target/$RELEASE_TARGET/release/shadenet$RELEASE_EXT"
          if [ -f "$NEW" ]; then "$NEW" --help >/dev/null; fi
          # The binary names the commit it was built from (launch gate).
          "$BIN" --version | grep -Fq "(commit ${GITHUB_SHA:0:12})"

      - name: Sign and notarize (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: >-
          bash scripts/release/macos-notarize.sh
          "target/$RELEASE_TARGET/release/shadenet"
          "target/$RELEASE_TARGET/release/shade-tree"

      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_EXT: ${{ matrix.ext }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: bash scripts/release/package.sh "$RELEASE_TARGET" "$RELEASE_VERSION" "-live" "$RELEASE_EXT"

      - name: Generate SPDX SBOM (shadenet)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.package.outputs.shadenet }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.shadenet }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM (shade-tree alias)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.package.outputs.shade_tree }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.shade_tree }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.artifacts }}

      - name: Attest SBOM (shadenet)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.shadenet }}
          sbom-path: ${{ steps.package.outputs.shadenet }}.spdx.json

      - name: Attest SBOM (shade-tree alias)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.shade_tree }}
          sbom-path: ${{ steps.package.outputs.shade_tree }}.spdx.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shade-tree-${{ matrix.target }}-live
          path: dist/*

  # ------------------------------------------------------------ client container image
  # Assembled from the musl live binaries built, smoke-tested and attested above; no
  # compilation or emulation here. Tags push to GHCR; a rehearsal builds and runs it only.
  image:
    name: client container image
    needs: [set-version, live]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/shadenet on tags
      id-token: write # Sigstore certificate for the image attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download musl live binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shade-tree-*-unknown-linux-musl-live
          path: dist
          merge-multiple: true

      - name: Stage binaries per Docker architecture
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; cpu="${pair##*:}"
            asset="shadenet-$RELEASE_VERSION-$cpu-unknown-linux-musl-live"
            (cd dist && sha256sum -c "$asset.sha256")
            mkdir -p "image/$arch"
            cp "dist/$asset" "image/$arch/shadenet"
          done

      - name: Build and smoke-test (amd64)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          docker buildx create --use --name shadenet >/dev/null
          docker buildx build --platform linux/amd64 --load \
            -f docker/shadenet.Dockerfile --build-arg VERSION="$RELEASE_VERSION" \
            -t shadenet:smoke .
          docker run --rm shadenet:smoke --help | grep -Eq '^[[:space:]]+proxy([[:space:]]|$)'

      - name: Push multi-arch image
        id: push
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadenet"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f docker/shadenet.Dockerfile --build-arg VERSION="$RELEASE_VERSION" \
            -t "$image:$RELEASE_VERSION" $([[ "$RELEASE_VERSION" == *-* ]] || echo "-t $image:latest") \
            --metadata-file "$RUNNER_TEMP/image.json" .
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ------------------------------------------------------------ node container image
  # The operator front door: Tor + the JS node + heartbeat from the tagged checkout, run from a
  # deployment record alone (docker/shadenet-node.Dockerfile, packages/node/bin/shadenet-node.mjs).
  # Multi-arch through QEMU since nothing native is compiled (pure JS deps). Tags push to GHCR.
  node-image:
    name: node container image
    needs: [set-version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/shadenet-node on tags
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and smoke-test (amd64)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          docker buildx create --use --name shadenet-node >/dev/null
          docker buildx build --platform linux/amd64 --load \
            -f docker/shadenet-node.Dockerfile --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT="$GITHUB_SHA" \
            -t shadenet-node:smoke .
          docker run --rm shadenet-node:smoke help | grep -q SHADENET_RECORD
          # No record: the supervisor refuses to start with the one-line reason, exit 2.
          set +e; out="$(docker run --rm shadenet-node:smoke run 2>&1)"; code=$?; set -e
          [[ $code -eq 2 ]] && grep -q "set SHADENET_RECORD" <<<"$out"
          docker run --rm shadenet-node:smoke status --quiet || true
          docker run --rm --entrypoint tor shadenet-node:smoke --version | grep -q "Tor version"

      - name: Push multi-arch image
        id: push
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadenet-node"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f docker/shadenet-node.Dockerfile --build-arg VERSION="$RELEASE_VERSION" --build-arg COMMIT="$GITHUB_SHA" \
            -t "$image:$RELEASE_VERSION" $([[ "$RELEASE_VERSION" == *-* ]] || echo "-t $image:latest") \
            --metadata-file "$RUNNER_TEMP/node-image.json" .
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/node-image.json")" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Release publication is isolated from compilation so build tools never receive
  # a token that can modify repository contents. A tag is published atomically only
  # after every default and live matrix entry has succeeded.
  publish:
    name: publish release assets
    needs: [set-version, default, live]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download artifacts created by this workflow run
      contents: write # attach assets to the tag's GitHub Release
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ needs.set-version.outputs.version }}
          path: release-metadata

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shade-tree-*
          path: dist
          merge-multiple: true

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
          sparse-checkout: scripts/release

      - name: Check out the third-party notices
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: notices
          sparse-checkout: THIRD-PARTY-NOTICES.md
          sparse-checkout-cone-mode: false

      - name: Ship the third-party notices with the binaries
        shell: bash
        run: cp notices/THIRD-PARTY-NOTICES.md dist/THIRD-PARTY-NOTICES.md

      - name: Render the Homebrew formula
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
        run: >-
          node src/scripts/release/homebrew-formula.mjs
          --version "$RELEASE_VERSION" --dist dist --repo "$GITHUB_REPOSITORY"

      - name: Revalidate the remote tag before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          while [[ "$object_type" == tag ]]; do
            object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq .object.type)"
            object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq .object.sha)"
          done
          if [[ "$object_type" != commit || "$object_sha" != "$RELEASE_COMMIT" ]]; then
            echo "release tag moved or no longer resolves to the validated event commit" >&2
            echo "expected commit: $RELEASE_COMMIT" >&2
            echo "current object: $object_type $object_sha" >&2
            exit 1
          fi

      - name: Attach to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-metadata/release-notes.md
          files: dist/*
          # v1.2.3-rc.1 and the like are prereleases and never become "Latest".
          prerelease: ${{ contains(needs.set-version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.set-version.outputs.version, '-') }}

      # Homebrew tap: a final release commits its formula to dmarzzz/homebrew-shadenet.
      # Credential, in order: HOMEBREW_TAP_DEPLOY_KEY (an SSH deploy key with write access
      # on the tap repo only; set 2026-09-30) or HOMEBREW_TAP_TOKEN (fine-grained,
      # contents:write on the tap only). Without either, or for a prerelease, this prints a
      # notice and does nothing.
      - name: Update the Homebrew tap
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ needs.set-version.outputs.version }}
          TAP_REPO: ${{ github.repository_owner }}/homebrew-shadenet
        run: |
          if [[ -z "$HOMEBREW_TAP_DEPLOY_KEY" && -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::notice::no tap credential: copy dist/shadenet.rb to ${TAP_REPO} Formula/ by hand"
            exit 0
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "::notice::prerelease ${RELEASE_VERSION}: the tap keeps the last final release"
            exit 0
          fi
          if [[ -n "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            umask 077
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$HOME/.ssh/tap_deploy_key"
            ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes"
            git clone --depth 1 "git@github.com:${TAP_REPO}.git" tap
          else
            git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          fi
          mkdir -p tap/Formula
          cp dist/shadenet.rb tap/Formula/shadenet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shadenet.rb
          if git diff --cached --quiet; then
            echo "tap already has shadenet ${RELEASE_VERSION}"
            exit 0
          fi
          git commit -m "shadenet ${RELEASE_VERSION}"
          git push origin HEAD
