---
- name: Restart Shade Tree node
  ansible.builtin.systemd_service:
    name: shade-tree-gateway
    state: restarted
    daemon_reload: true
  when: shade_tree_runs_node | bool

- name: Restart Shade Tree heartbeat
  ansible.builtin.systemd_service:
    name: shade-tree-heartbeat
    state: restarted
    daemon_reload: true
  when: shade_tree_runs_node | bool

- name: Restart Elder Tree
  ansible.builtin.systemd_service:
    name: shade-tree-bootnode
    state: restarted
    daemon_reload: true
  when: shade_tree_runs_elder | bool

