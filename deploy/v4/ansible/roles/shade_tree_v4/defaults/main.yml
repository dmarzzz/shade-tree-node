---
shade_tree_deployment_record: ""
shade_tree_controller_repo_root: "{{ playbook_dir }}/../../.."
shade_tree_target_mode: node
shade_tree_admin_cidr: ""
shade_tree_manage_firewall: true
shade_tree_ssh_port: 22
shade_tree_identity_source: ""
shade_tree_members_file: ""
shade_tree_install_dir: /opt/shade-tree
shade_tree_gateway_region: ""
shade_tree_enable_pow: false
# Zero-downtime gateway restarts (docs/OPERATOR.md "Restart without dropping a connection"): systemd
# owns the loopback listening socket and hands it to each gateway process. The first roll with this
# on stops the self-binding gateway once so the socket can take the port; every later restart is warm.
shade_tree_socket_activation: true
# Webhook alerts without Prometheus (packages/node/lib/alerts.mjs); empty = off.
shade_tree_alert_webhook: ""
shade_tree_alert_webhook_format: generic
shade_tree_operator_authorized: false
shade_tree_rpc_url: ""
shade_tree_slash_key: ""
shade_tree_gateway_operator_key: ""
shade_tree_force_reconcile: false
shade_tree_fleet_tally_peers: ""
shade_tree_fleet_tally_token: ""
shade_tree_fleet_tally_port: 8879

# Reachability gate after the postflight (issue #254): a reconcile restarts Tor, the host's onion
# publishes a new descriptor, and for a few minutes clients cannot connect although every unit is
# active. The role waits, bounded, until the onion accepts connections through the host's own Tor
# and (on a node) the heartbeat has been accepted since the restart. `all` requires every Elder
# Tree the node announces to; use `any` to roll while one Elder is known to be down.
shade_tree_wait_ready: true
shade_tree_ready_timeout_seconds: 600
shade_tree_ready_elders: all
shade_tree_tor_socks_port: 9050

shade_tree_bootnode_port: 8877
shade_tree_gateway_port: 8443
shade_tree_tunnel_max_payload_bytes: 41943040
shade_tree_elder_metrics_port: 9100
shade_tree_node_metrics_port: 9101
shade_tree_heartbeat_metrics_port: 9103

# Extra staked sets this node admits besides the record's (one node serving two canopies, e.g.
# the staging set beside production). Each entry: { contract: 0x..., deployBlock: N }. Rendered
# into bootstrap.sh's SHADENET_SETS -> SHADE_TREE_GROUP_CONTRACT + SHADE_TREE_FROM_BLOCKS comma lists.
shade_tree_extra_sets: []
